<html>

<head></head>

<body>
    <h1>الاهداف الشخصية</h1>
    <img src="logo.jpg" alt="صورة لشعار الاهداف" width="110" height="100">
    <hr>
    <p>يرجى ملئ الخانات التالية لادخال الهدف المالي الشخصي</p>

    <div><label for="goal-img">صورة الهدف:</label></div>
    <input type="file" id="goal-img">

    <div><label for="goal-title">عنوان الهدف:</label></div>
    <input type="text" placeholder="عنوان الهدف" id="goal-title">

    <div><label for="goal-desc">وصف الهدف:</label></div>
    <textarea placeholder="وصف الهدف" id="goal-desc"></textarea>

    <div><label for="goal-date">تاريخ الهدف:</label></div>
    <input type="date" id="goal-date">

    <div><label for="goal-amount">المبلغ المطلوب:</label></div>
    <input type="number" placeholder="المبلغ المطلوب" id="goal-amount" min="0">

    <div><button>حفظ</button></div>
</body>

</html>
