<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Coffee House</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="logo">
            Coffee House
        </div>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to Coffee House</h1>
        <p>
            Fresh coffee and homemade desserts.
        </p>
        <button>
            Explore Menu
        </button>

    <section class="services">
        <div class="card">
            <h2>Coffee</h2>
            <p>Premium roasted beans.</p>
        </div>
        <div class="card">
            <h2>Desserts</h2>
            <p>Fresh cakes every day.</p>

        <div class="card">
            <h2>Free Wi-Fi</h2>
            <p>Work and enjoy your drink.</p>

    <footer class="footer">
        © 2026 Coffee House
    </footer>
